plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlinOptions {
    jvmTarget = "17"
}
    namespace 'com.darkhacker.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.darkhacker.launcher'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }
}
